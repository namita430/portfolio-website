# Netlify configuration for the frontend (the React app lives in client/).
# Full instructions: docs/DEPLOYMENT.md

[build]
  base    = "client"        # Netlify runs the build inside client/ (publish is relative to base)
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set these in Netlify -> Site configuration -> Environment variables (not here):
  #   VITE_API_BASE_URL   e.g. https://your-api.onrender.com/api/v1
  #   VITE_SITE_URL       e.g. https://your-site.netlify.app   (later: https://yourname.com.np)
  #   VITE_TURNSTILE_SITE_KEY   optional (Cloudflare Turnstile site key)

# --- OPTIONAL: same-origin API proxy -------------------------------------------------------------
# With this rule the browser talks to /api/... on YOUR domain and Netlify forwards it to the API, so the
# admin session cookie is first-party (no cross-site cookie problems). Trade-off: Netlify proxy requests time
# out after 26 seconds, which is shorter than a free Render server's ~60 s cold start. To use it:
#   1. uncomment the block below and put your real API address in `to`
#   2. set VITE_API_BASE_URL=/api/v1 in Netlify
#   3. set COOKIE_SAMESITE=lax on the API
# It MUST stay above the catch-all rule.
#
# [[redirects]]
#   from   = "/api/*"
#   to     = "https://YOUR-API-NAME.onrender.com/api/:splat"
#   status = 200
#   force  = true
# --------------------------------------------------------------------------------------------------

# Single-page app fallback: deep links such as /projects/smartbite and /admin keep working after a refresh.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # script-src allows only this site (+ Cloudflare Turnstile). Styles need 'unsafe-inline' for the animation
    # library's inline style attributes. img/frame/connect allow https: because uploaded files and the API live
    # on other hosts (object storage, API server).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Built files have content hashes in their names, so they can be cached "forever".
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell must always be revalidated so new deployments are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
