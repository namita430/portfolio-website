# Render Blueprint for the API (the Express server lives in server/).
# Docs: https://render.com/docs/blueprint-spec   ·   Full walkthrough: docs/DEPLOYMENT.md
#
# Render will ask for every variable marked `sync: false` when you create the Blueprint.
# Nothing secret belongs in this file.

services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free              # free web services sleep after 15 minutes without traffic (~1 minute to wake up)
    region: singapore       # closest Render region to Nepal; choose the database region nearby too
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start # applies pending database migrations, optionally seeds an empty DB, starts the API
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY       # Render sits behind exactly one proxy
        value: "1"
      - key: SESSION_SECRET    # random 256-bit value generated by Render
        generateValue: true
      - key: SEED_ON_START     # first deploy only fills an EMPTY database with Namita's starter content
        value: "true"
      - key: COOKIE_SAMESITE   # "none" while the site and API are on different domains; "lax" once both are on your .com.np
        value: none
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: EMAIL_PROVIDER    # change to "resend" after following docs/DEPLOYMENT.md
        value: none
      # ---- you will be prompted for these ----
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS  # e.g. https://your-site.netlify.app  (comma-separate several)
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
